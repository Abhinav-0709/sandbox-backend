services:
  - type: web
    name: vivoki-sandbox-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_DEV_AUTH
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000,http://localhost:3005"
      - key: DATABASE_URL
        sync: false
